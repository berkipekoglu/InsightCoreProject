version: '3.8'

networks:
  insightcore-network:
    driver: bridge

services:
  postgres:
    image: postgres:17.6
    container_name: insightcore_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: insightcore_db
      POSTGRES_USER: insightcore_user
      POSTGRES_PASSWORD: insightcore_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgresql_schemas.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightcore_user -d insightcore_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insightcore-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: insightcore_clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: insightcore_user
      CLICKHOUSE_PASSWORD: insightcore_password
      CLICKHOUSE_DB: insightcore_analytics
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q 'http://localhost:8123/ping'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insightcore-network

  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: insightcore_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: insightcore_user
      RABBITMQ_DEFAULT_PASS: insightcore_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insightcore-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: insightcore_minio
    restart: always
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: insightcore_minio_user
      MINIO_ROOT_PASSWORD: insightcore_minio_password
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insightcore-network

  collector-api:
    build: ./collector-api
    container_name: insightcore_collector_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      RABBITMQ_URL: amqp://insightcore_user:insightcore_password@rabbitmq
    command: sh -c "npm cache clean --force && npm install && npm run build && npm start"
    volumes:
      - ./sdk:/app/sdk
    networks:
      - insightcore-network
    depends_on:
      rabbitmq:
        condition: service_healthy

  processor-worker:
    build: ./processor-worker
    container_name: insightcore_processor_worker
    restart: always
    environment:
      RABBITMQ_URL: amqp://insightcore_user:insightcore_password@rabbitmq
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: insightcore_user
      CLICKHOUSE_PASSWORD: insightcore_password
      CLICKHOUSE_DATABASE: insightcore_analytics
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: insightcore_minio_user
      MINIO_SECRET_KEY: insightcore_minio_password
    command: sh -c "npm install && npm run build && npm start"
    networks:
      - insightcore-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy

  dashboard-api:
    build: ./dashboard-api
    container_name: insightcore_dashboard_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://insightcore_user:insightcore_password@postgres:5432/insightcore_db
      JWT_SECRET: "YOUR_SUPER_SECRET_JWT_SECRET_CHANGE_ME"
    volumes:
      - ./dashboard-api:/app
      - /app/node_modules
    command: sh -c "npm install && npm rebuild bcrypt --build-from-source && npm run build && npm run dev"
    networks:
      - insightcore-network
    depends_on:
      postgres:
        condition: service_healthy

  dashboard-frontend:
    build: ./dashboard-frontend
    container_name: insightcore_dashboard_frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
    volumes:
      - ./dashboard-frontend:/app
      - /app/node_modules
    command: sh -c "npm run dev -- --webpack"
    networks:
      - insightcore-network
    depends_on:
      - collector-api
      - dashboard-api

  docs:
    build: ./docs
    container_name: insightcore_docs
    restart: always
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: development
    volumes:
      - ./docs:/app
      - /app/node_modules
    command: sh -c "npm run dev -- --webpack"
    networks:
      - insightcore-network
    depends_on:
      - collector-api

volumes:
  db-data:
  clickhouse-data:
  clickhouse-logs:
  rabbitmq-data:
  minio-data:
